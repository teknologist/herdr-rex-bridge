[workspace]
members = ["crates/ghostty-sys"]
resolver = "2"
[package]
name = "herdr-rex-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.22"
ghostty-sys = { path = "crates/ghostty-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.29"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
url = "2"
